<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>BGM</title></head>
<body style="margin:0;background:#000;">
<audio id="bgm" loop>
  <source src="Videos/BS_BGM.mp4">
</audio>
<script>
  const bgm = document.getElementById("bgm");

  let started = false;   // 로비에 도달하기 전에는 설정을 바꿔도 음악을 시작하지 않는다
  let enabled = true;
  let volume = 1;

  function apply() {
    bgm.volume = volume;
    if (!started) return;
    if (enabled && volume > 0) bgm.play().catch(() => {});
    else bgm.pause();
  }

  // 닉네임 입력을 마치고 로비에 도달했을 때만 main.js가 여기로 재생 신호를 보낸다.
  window.bsAudio.onPlay(() => {
    started = true;
    apply();
  });

  // 설정 화면에서 음악을 껐다 켜거나 볼륨을 움직일 때마다 전달된다.
  window.bsAudio.onSettings((settings) => {
    enabled = settings.enabled !== false;
    volume = Math.min(1, Math.max(0, Number(settings.volume) || 0));
    apply();
  });
</script>
</body>
</html>
