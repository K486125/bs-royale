<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Royale - 다운로드</title>
<link rel="icon" href="icon.png">
<meta name="description" content="친구와 1대1로 겨루는 실시간 대전 게임. Windows용 무료 다운로드.">
<style>
  /* 앱(css/style.css)의 색과 버튼 모양을 그대로 가져왔다 */
  :root {
    --accent: #ffcc33;
    --accent-edge: #b58900;
    --text: #eef0f8;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
    /* 영상이 도착하기 전에도 화면이 비어 보이지 않도록, 영상과 비슷한 파란 배경을 깔아둔다 */
    background: radial-gradient(circle at 50% 45%, #1a86b8, #0b3a72 70%, #06254c);
    overflow: hidden;
  }

  /* 영상을 받는 동안 보여주는 로딩 화면 (앱의 로딩 화면과 같은 모양) */
  .loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(10, 13, 30, .9);
    transition: opacity .5s ease;
  }
  .loading.hide {
    opacity: 0;
    pointer-events: none;
  }
  .loading-spinner {
    width: 56px;
    height: 56px;
    border: 6px solid #3a4480;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: bs-spin .8s linear infinite;
  }
  @keyframes bs-spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 15px;
    font-weight: 800;
    color: #c6cdf0;
    letter-spacing: .5px;
  }
  /* 영상 받은 정도를 보여주는 가는 막대 */
  .loading-bar {
    width: min(260px, 60vw);
    height: 6px;
    border-radius: 4px;
    background: #232948;
    overflow: hidden;
  }
  .loading-bar span {
    display: block;
    width: 0%;
    height: 100%;
    background: var(--accent);
    transition: width .25s ease;
  }

  /* 로딩이 끝나면 본문이 부드럽게 나타난다 */
  main, .music-btn {
    opacity: 0;
    transition: opacity .5s ease;
  }
  body.ready main,
  body.ready .music-btn { opacity: 1; }

  /* 배경 영상: 화면을 잘라내며 꽉 채운다 */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
  }

  /* 글자가 묻히지 않도록 영상 위에 어두운 막을 한 겹 덮는다 */
  .bg-shade {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.15), rgba(0,0,0,.62) 75%);
    pointer-events: none;
  }

  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    text-align: center;
  }

  .logo {
    width: 132px;
    height: 132px;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.55));
  }

  /* 앱의 "1대1 대전" 제목과 같은 압출 그림자 */
  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 92px);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.1;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000,
      -2px  2px 0 #000, 2px  2px 0 #000,
      0 2px 0 #000, 0 5px 0 #000, 0 8px 0 #000,
      0 16px 18px rgba(0,0,0,.45);
  }

  .tagline {
    margin: 0;
    font-size: clamp(14px, 2.2vw, 20px);
    font-weight: 800;
    color: #dfe4ff;
    text-shadow: 0 2px 0 #000, 0 4px 10px rgba(0,0,0,.6);
  }

  /* 앱의 노란 버튼(.btn)을 크게 키운 형태 */
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--accent);
    color: #241a00;
    border: 4px solid var(--accent-edge);
    border-radius: 14px;
    padding: 20px 44px;
    font-family: inherit;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 900;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--accent-edge), 0 12px 24px rgba(0,0,0,.45);
    transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
  }
  .download-btn:hover { filter: brightness(1.06); }
  .download-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 var(--accent-edge), 0 6px 14px rgba(0,0,0,.4);
  }
  /* 윈도우 로고 (네 칸). 버튼 글자와 같은 색을 쓰도록 currentColor로 칠한다 */
  .download-btn .win-icon {
    width: 1.05em;
    height: 1.05em;
    fill: currentColor;
    flex-shrink: 0;
  }

  .version {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: #c6cdf0;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
  }

  /* Windows가 아닌 기기: .exe는 PC에서만 실행되므로 버튼을 눌리지 않게 막는다 */
  .download-btn.disabled {
    background: #5a5f69;
    color: #d0d3da;
    border-color: #3c4048;
    box-shadow: 0 6px 0 #3c4048, 0 12px 24px rgba(0,0,0,.45);
    cursor: not-allowed;
    pointer-events: none;
  }

  .platform-note {
    display: none;
    margin: 0;
    font-size: clamp(14px, 2vw, 17px);
    font-weight: 800;
    color: #ffd85c;
    text-shadow: 0 2px 0 #000, 0 4px 10px rgba(0,0,0,.7);
  }
  .platform-note.show { display: block; }

  /* 음악 버튼: 다운로드 버튼과 같은 디자인을 작게 줄여 좌측 하단에 둔다.
     (브라우저가 소리 있는 자동재생을 막기 때문에 직접 눌러야 음악이 시작된다) */
  .music-btn {
    position: fixed;
    left: 24px;
    bottom: 24px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #241a00;
    border: 3px solid var(--accent-edge);
    border-radius: 12px;
    padding: 13px 22px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-edge), 0 10px 20px rgba(0,0,0,.45);
    transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
  }
  .music-btn:hover { filter: brightness(1.06); }
  .music-btn:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 var(--accent-edge), 0 5px 12px rgba(0,0,0,.4);
  }

  /* 버튼 안에 들어가는 ON/OFF 스위치 */
  .music-btn .toggle {
    position: relative;
    width: 58px;
    height: 28px;
    border-radius: 999px;
    background: #a07800;
    border: 2px solid #8a6a00;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.4);
    transition: background .25s ease, border-color .25s ease;
  }
  /* 꺼져 있을 때는 오른쪽에 OFF, 켜져 있을 때는 왼쪽에 ON (손잡이 반대편) */
  .music-btn .toggle::before {
    content: "OFF";
    position: absolute;
    top: 50%;
    right: 7px;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .5px;
    color: #fff1c9;
  }
  .music-btn .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff8e0;
    box-shadow: 0 2px 3px rgba(0,0,0,.45);
    transition: left .25s cubic-bezier(.2,.8,.3,1), background .25s ease;
  }

  .music-btn.on .toggle {
    background: #2fa84f;
    border-color: #1c7a37;
  }
  .music-btn.on .toggle::before {
    content: "ON";
    right: auto;
    left: 9px;
    color: #eaffef;
  }
  .music-btn.on .knob {
    left: 32px;
    background: #fff;
  }


  @media (max-width: 600px) {
    main { gap: 18px; }
    .logo { width: 92px; height: 92px; }
    .download-btn { padding: 16px 30px; }
    .music-btn { left: 14px; bottom: 14px; padding: 11px 16px; font-size: 14px; }
  }
</style>
</head>
<body>

<video id="bg" class="bg-video" autoplay loop muted playsinline preload="auto">
  <source src="BS_BGM.mp4" type="video/mp4">
</video>
<div class="bg-shade"></div>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-bar"><span id="loading-fill"></span></div>
  <div class="loading-text">불러오는 중...</div>
</div>

<main>
  <img class="logo" src="icon.png" alt="">
  <h1>BS ROYALE</h1>
  <p class="tagline">친구와 1대1로 겨루는 실시간 대전 게임</p>

  <a id="download" class="download-btn" href="https://github.com/K486125/bs-royale/releases/latest">
    <svg class="win-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="1.5" y="1.5" width="9.6" height="9.6" rx="1"/>
      <rect x="12.9" y="1.5" width="9.6" height="9.6" rx="1"/>
      <rect x="1.5" y="12.9" width="9.6" height="9.6" rx="1"/>
      <rect x="12.9" y="12.9" width="9.6" height="9.6" rx="1"/>
    </svg><span class="label">Windows용 다운로드</span>
  </a>
  <p class="platform-note" id="platform-note">PC에서 다운로드 가능합니다</p>
  <p class="version" id="version">최신 버전을 확인하는 중...</p>
</main>

<button id="sound" class="music-btn" type="button" aria-pressed="false">
  <span class="label">음악</span>
  <span class="toggle"><span class="knob"></span></span>
</button>

<script>
  const REPO = "K486125/bs-royale";

  // ---------- 로딩 화면 ----------
  // 배경 영상이 7MB라 처음 접속에서는 몇 초 걸린다. 그동안 빈 화면을 보여주는 대신
  // 로딩 화면을 덮어두고, 영상이 재생 가능한 시점에 걷어낸다.
  const loading = document.getElementById("loading");
  const loadingFill = document.getElementById("loading-fill");
  const bgVideo = document.getElementById("bg");
  let finished = false;

  function finishLoading() {
    if (finished) return;
    finished = true;
    loadingFill.style.width = "100%";
    document.body.classList.add("ready");
    loading.classList.add("hide");
    setTimeout(() => loading.remove(), 600);

    // 화면을 받는 동안 영상이 이미 얼마간 흘러가 있으므로, 처음부터 다시 시작한다.
    // (음악도 이 영상의 소리라서 같이 처음부터 나온다)
    restartFromStart();
  }

  function restartFromStart() {
    try {
      bgVideo.currentTime = 0;
    } catch (e) {
      // 아직 되감을 수 없는 상태면 그냥 이어서 재생한다
    }
    bgVideo.play().catch(() => {});
  }

  // 얼마나 받았는지 막대에 표시한다 (영상 길이 대비 버퍼된 구간)
  function updateProgress() {
    if (finished || !bgVideo.duration) return;
    if (bgVideo.buffered.length > 0) {
      const ratio = bgVideo.buffered.end(bgVideo.buffered.length - 1) / bgVideo.duration;
      loadingFill.style.width = `${Math.min(95, Math.round(ratio * 100))}%`;
    }
  }

  bgVideo.addEventListener("progress", updateProgress);
  bgVideo.addEventListener("loadeddata", updateProgress);
  // 끊김 없이 재생할 수 있게 되면 바로 시작한다. 그 전이라도 재생이 시작되면 걷어낸다.
  bgVideo.addEventListener("canplaythrough", finishLoading);
  bgVideo.addEventListener("playing", finishLoading);
  bgVideo.addEventListener("error", finishLoading); // 영상이 안 되더라도 페이지는 보여야 한다

  // 인터넷이 아주 느린 경우까지 기다리게 하지 않는다. 배경은 파란 화면으로도 충분하다.
  setTimeout(finishLoading, 6000);

  // ---------- 배경 영상 소리 ----------
  // 브라우저는 소리 있는 자동재생을 막기 때문에, 음소거로 시작하고
  // 사용자가 화면을 한 번 건드리면 그때 소리를 켠다.
  const video = document.getElementById("bg");
  const soundBtn = document.getElementById("sound");

  // 브라우저가 소리를 막고 있었기 때문에, 소리를 처음 켜는 순간이 음악이 실제로 들리기
  // 시작하는 시점이다. 그 순간에도 음악이 중간부터 나오지 않도록 앞으로 되감는다.
  let soundStarted = false;

  function setMuted(muted) {
    video.muted = muted;
    soundBtn.classList.toggle("on", !muted);
    soundBtn.setAttribute("aria-pressed", String(!muted));

    if (!muted) {
      if (!soundStarted) {
        soundStarted = true;
        restartFromStart();
      } else {
        video.play().catch(() => {});
      }
    }
  }

  // 음악은 이 버튼을 눌렀을 때만 나온다. 모르고 클릭했다가 갑자기 소리가 나는 일은 없다.
  soundBtn.addEventListener("click", () => setMuted(!video.muted));

  // ---------- Windows가 아니면 버튼을 막는다 ----------
  // .exe는 PC 전용이라 폰에서는 받아도 실행할 수 없다. 받기 전에 막고 알려준다.
  const isWindows = /Windows NT/i.test(navigator.userAgent);

  // ---------- 최신 설치 파일 연결 ----------
  // 버전이 올라가도 이 페이지를 고칠 필요가 없도록, 최신 릴리스를 물어봐서 링크를 채운다.
  const link = document.getElementById("download");
  const versionText = document.getElementById("version");

  if (!isWindows) {
    link.classList.add("disabled");
    link.removeAttribute("href");
    link.querySelector(".label").textContent = "다운로드 불가";
    document.getElementById("platform-note").classList.add("show");
  }

  fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
    .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
    .then((release) => {
      const setup = (release.assets || []).find((a) => a.name.endsWith(".exe"));
      if (setup) link.href = setup.browser_download_url;

      const size = setup ? ` · ${Math.round(setup.size / 1024 / 1024)}MB` : "";
      versionText.textContent = `최신 버전 ${release.tag_name} · Windows 10/11${size}`;
    })
    .catch(() => {
      // 조회에 실패해도 버튼은 릴리스 페이지로 이동하므로 다운로드는 가능하다.
      versionText.textContent = "Windows 10/11 · 릴리스 페이지에서 받기";
    });
</script>

</body>
</html>
