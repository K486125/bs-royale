<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>BS Battle - 유닛 배치</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="battle-page">

<div class="titlebar"><span class="titlebar-title">BS Royale</span></div>

<video class="bg-video" autoplay loop muted playsinline>
  <source src="Videos/BS_BGM.mp4" type="video/mp4">
</video>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">전투 준비 중...</div>
</div>

<main id="battle-main" class="battle-main hidden">
  <aside id="unit-sidebar" class="unit-sidebar">
    <div id="unit-slots" class="unit-slots"></div>

    <!-- 고른 유닛으로 무엇을 할지 (공격은 아직 준비 중) -->
    <div id="turn-actions" class="turn-actions hidden">
      <button id="act-move" class="action-btn" type="button">이동 (W)</button>
      <button id="act-attack" class="action-btn" type="button" disabled>공격</button>
    </div>

    <!-- 개발/테스트용: 켜두면 배치 단계에서 유닛 3개가 알아서 무작위로 놓인다 -->
    <div class="auto-place">
      <span class="auto-place-label">자동 배치</span>
      <button id="auto-place" class="auto-toggle" type="button" aria-pressed="false" aria-label="자동 배치">
        <span class="knob"></span>
      </button>
    </div>
  </aside>

  <div class="battle-center">
    <div id="placement-timer" class="placement-timer hidden">배치 시간: 1:00</div>
    <div id="turn-bar" class="turn-bar hidden">턴 1/10</div>
    <div id="battle-map" class="battle-map"></div>
  </div>
</main>

<div id="countdown-overlay" class="countdown-overlay hidden">
  <div id="countdown-number" class="countdown-number">3</div>
</div>

<div id="match-end-overlay" class="countdown-overlay hidden">
  <div class="match-end-text">매치 종료</div>
</div>

<!-- 화면 한가운데에 뜨는 알림 -->
<div id="notice-stack" class="notice-stack"></div>
<div id="toast" class="toast"></div>

<script src="js/no-zoom.js"></script>
<script type="module" src="js/battle.js"></script>
</body>
</html>
