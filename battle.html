<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>BS Battle</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="battle-page">

<div class="titlebar"><span class="titlebar-title">BS Royale</span></div>

<video class="bg-video" autoplay loop muted playsinline>
  <source src="Videos/BS_BGM.mp4" type="video/mp4">
</video>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">전투 준비 중...</div>
</div>

<main id="battle-main" class="battle-main hidden">
  <aside id="unit-sidebar" class="unit-sidebar">
    <div id="unit-slots" class="unit-slots"></div>

    <!-- 에너지: 세 유닛이 함께 쓰는 하나뿐인 값 -->
    <div id="my-energy" class="energy-ring hidden">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="41"></circle>
        <circle class="ring-fill" cx="50" cy="50" r="41"></circle>
      </svg>
      <span class="ring-value">100</span>
    </div>
  </aside>

  <!-- 상대 유닛 상태 (체력만 보여준다) -->
  <aside id="enemy-sidebar" class="unit-sidebar enemy playing hidden">
    <div id="enemy-slots" class="unit-slots"></div>
    <div id="enemy-energy" class="energy-ring hidden">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="41"></circle>
        <circle class="ring-fill" cx="50" cy="50" r="41"></circle>
      </svg>
      <span class="ring-value">100</span>
    </div>
  </aside>

  <div class="battle-center">
    <div id="turn-bar" class="turn-bar hidden">00:00</div>
    <!-- 판(15x15)이 화면보다 커서, 보이는 창 안에서 판을 옮겨 내 유닛을 따라간다 -->
    <div id="map-viewport" class="map-viewport">
      <div id="battle-map" class="battle-map"></div>
    </div>

    <!-- 고른 유닛으로 무엇을 할지. 판 바로 아래 가운데 (재장전은 시간이 알아서 한다) -->
    <div id="turn-actions" class="turn-actions hidden">
      <div id="act-move" class="action-btn">이동 WASD</div>
      <div id="act-attack" class="action-btn">조준 ←↑↓→ · 공격 Space</div>
    </div>
  </div>
</main>

<div id="countdown-overlay" class="countdown-overlay hidden">
  <div id="countdown-number" class="countdown-number">3</div>
</div>

<div id="match-end-overlay" class="countdown-overlay hidden">
  <div class="match-end-text">매치 종료</div>
</div>

<!-- 화면 한가운데에 뜨는 알림 -->
<div id="notice-stack" class="notice-stack"></div>
<div id="toast" class="toast"></div>

<script src="js/no-zoom.js"></script>
<script type="module" src="js/battle.js"></script>
</body>
</html>
