<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>BS Battle - 대기실</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="room-page">

<div class="titlebar"><span class="titlebar-title">BS Royale</span></div>

<div id="room-loading" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">대기실로 들어가는 중...</div>
</div>

<video class="bg-video" autoplay loop muted playsinline>
  <source src="Videos/BS_BGM.mp4" type="video/mp4">
</video>

<main class="team-screen">
  <h1 class="battle-banner">1대1 대전</h1>

  <section class="team-block">
    <ul id="my-row" class="team-row"></ul>
  </section>

  <section class="team-block">
    <!-- 채팅 버튼은 상대 카드줄의 오른쪽 끝 아래에 붙는다 -->
    <div class="chat-anchor">
      <ul id="opponent-row" class="team-row"></ul>
      <button id="chat-toggle" class="chat-toggle" title="채팅 열기/닫기" aria-label="채팅">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
          <circle class="dot" cx="8.5" cy="10.5" r="1.3"/>
          <circle class="dot" cx="12" cy="10.5" r="1.3"/>
          <circle class="dot" cx="15.5" cy="10.5" r="1.3"/>
        </svg>
        <span id="chat-badge" class="chat-badge hidden">0</span>
      </button>
    </div>
  </section>
</main>

<div id="unit-modal" class="modal hidden">
  <div class="modal-box avatar-picker-box">
    <div class="picker-header">
      <h2>유닛 선택</h2>
      <span id="unit-count" class="picker-count"></span>
    </div>
    <ul id="unit-picker-row" class="team-row avatar-scroll-row"></ul>
  </div>
</div>

<button id="leave-btn" class="btn leave leave-btn-fixed">나가기</button>
<button id="ready-btn" class="ready-btn">게임 준비</button>

<aside id="chat-panel" class="panel chat-panel collapsed">
  <div class="panel-header">
    <h2>채팅</h2>
    <button id="chat-close" class="btn icon-btn" title="채팅 닫기">✕</button>
  </div>
  <div id="chat-log" class="chat-log"></div>
  <form id="chat-form" class="chat-form" autocomplete="off">
    <input id="chat-input" class="chat-input" type="text" maxlength="200" placeholder="메시지를 입력하세요">
    <button type="submit" class="chat-send">전송</button>
  </form>
</aside>

<div id="request-bar" class="request-bar hidden"></div>
<!-- 화면 맨 위에 쌓이는 알림 바 -->
<div id="notice-stack" class="notice-stack"></div>
<div id="toast" class="toast"></div>

<script src="js/no-zoom.js"></script>
<script type="module" src="js/room.js"></script>
</body>
</html>
