<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>BS Battle - 로비</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="lobby-page">

<div class="titlebar"><span class="titlebar-title">BS Royale</span></div>

<video class="bg-video" autoplay loop muted playsinline>
  <source src="Videos/BS_BGM.mp4" type="video/mp4">
</video>

<div id="app-loading" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">BS ROYALE</div>
</div>

<div id="name-modal" class="modal hidden">
  <div class="modal-box name-setup-box">
    <h2>닉네임과 프로필을 설정하세요</h2>
    <div class="name-setup-preview">
      <span id="setup-avatar-frame" class="avatar-frame avatar-frame-lg" style="cursor:pointer;"><img id="setup-avatar-img" class="avatar" src="" alt=""></span>
      <input id="name-input" type="text" maxlength="12" placeholder="닉네임">
    </div>
    <button id="name-confirm-btn" class="btn">확인</button>
  </div>
</div>

<div class="player-card">
  <span id="my-avatar-frame" class="avatar-frame avatar-frame-lg" style="cursor:pointer;"><img id="my-avatar-img" class="avatar" src="" alt=""></span>
  <span id="my-name-label" class="player-name"></span>
</div>

<div id="avatar-modal" class="modal hidden">
  <div class="modal-box avatar-picker-box">
    <div class="picker-header">
      <h2>프로필 선택</h2>
      <span id="avatar-count" class="picker-count"></span>
    </div>
    <ul id="avatar-picker-row" class="team-row avatar-scroll-row"></ul>
  </div>
</div>

<main class="lobby">
  <section class="panel collapsed">
    <div class="panel-header">
      <h2>방 목록</h2>
    </div>
    <ul id="room-list" class="room-list"></ul>
  </section>
</main>

<div class="bottom-left-actions">
  <button id="create-room-btn" class="btn lobby-action-btn">방 만들기</button>
  <button id="toggle-sidebar-btn" class="btn lobby-action-btn icon-btn" title="방 목록 열기/닫기">☰</button>
  <button id="settings-btn" class="btn lobby-action-btn icon-btn" title="설정">⚙</button>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="modal-box settings-box">
    <h2>설정</h2>

    <div class="setting-block">
      <div class="setting-row">
        <span class="setting-label">배경음악</span>
        <button id="music-toggle" class="switch" type="button" aria-label="배경음악 켜기/끄기"><span class="knob"></span></button>
      </div>
      <div class="setting-row">
        <input id="music-volume" class="setting-slider" type="range" min="0" max="100" step="1">
        <span id="music-volume-value" class="setting-value">100</span>
      </div>
    </div>

    <div class="setting-block">
      <div class="setting-row">
        <span class="setting-label">효과음</span>
        <button id="sfx-toggle" class="switch" type="button" aria-label="효과음 켜기/끄기"><span class="knob"></span></button>
      </div>
      <div class="setting-row">
        <input id="sfx-volume" class="setting-slider" type="range" min="0" max="100" step="1">
        <span id="sfx-volume-value" class="setting-value">100</span>
      </div>
    </div>

    <button id="settings-close-btn" class="btn">닫기</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/no-zoom.js"></script>
<script type="module" src="js/lobby.js"></script>
</body>
</html>
